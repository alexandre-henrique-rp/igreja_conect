<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Igreja Conect — Aceitar convite</title><link rel="stylesheet" href="assets/tokens.css"><script src="assets/app.js" defer></script></head><body><main class="center-auth" data-od-id="invite-page"><div class="card auth-card"><div class="auth-logo-row"><span class="brand-mark"></span><span class="brand-name">Igreja Conect</span></div><h1 data-od-id="invite-title">Bem-vindo à Igreja Conect</h1><p class="lead">Complete seu cadastro para acessar a plataforma.</p><form class="js-form" data-od-id="invite-form"><div class="field"><label for="invite-name">Nome completo <span>*</span></label><input class="input" id="invite-name" placeholder="Como devemos chamar você?" required></div><div class="field"><label for="invite-password">Senha <span>*</span></label><div class="input-group"><svg class="icon"><use href="assets/icons.svg#lock"></use></svg><input class="input" id="invite-password" type="password" placeholder="Mínimo de 8 caracteres" required></div></div><div class="field"><label for="invite-confirm">Confirmar senha <span>*</span></label><input class="input" id="invite-confirm" type="password" placeholder="Repita sua senha" required></div><button class="btn btn-primary btn-lg" type="submit" data-od-id="invite-submit">Criar conta</button></form><div class="warn-note"><svg class="icon icon-sm"><use href="assets/icons.svg#clock"></use></svg><span>Token expira em 1h 45min</span></div><p class="auth-footnote"><a href="login.html">Voltar para o login</a></p></div></main></body></html>
